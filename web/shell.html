<style>
  html, body { margin: 0; height: 100%; background: #08080a; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  /* 16:10, as large as the viewport allows */
  canvas { display: block; width: min(100vw, 160vh); height: min(62.5vw, 100vh); outline: none; }
  #status { position: fixed; left: 12px; bottom: 10px; color: #667; font: 12px/1.4 monospace; pointer-events: none; }
</style>

<body>
<canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
<div id="status">click: drop &nbsp; drag: finger &nbsp; right-drag: orbit &nbsp; wheel: zoom &nbsp; t: container &nbsp; h: help &nbsp; ?grid=512 for a finer mesh</div>
<script>
  var Module = {
    canvas: document.getElementById('canvas'),
    print: function (t) { console.log(t); },
    printErr: function (t) { console.error(t); },
  };
  document.getElementById('canvas').focus();
</script>
