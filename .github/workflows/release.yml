# A release: push a tag v<version> (the version in src/version.h, which
# pond --version and pond.1 also carry) and this builds and tests pond on Linux
# and macOS, then makes a GitHub release with a source tarball and a binary
# tarball per platform (the program, its manual, the demos).
#
#   git tag v0.43 && git push origin v0.43
name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: the tag is the version
        run: |
          v=$(sed -n 's/^#define POND_VERSION "\(.*\)"/\1/p' src/version.h)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME, but src/version.h says $v"; exit 1; }
      - name: deps (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - name: deps (macos)
        if: runner.os == 'macOS'
        run: brew install sdl2
      - name: build and test
        run: make -j4 && make test
      - name: package
        run: make bindist
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.os }}
          path: build/pond-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: source tarball
        run: make dist
      - uses: actions/download-artifact@v4
        with:
          path: build/bin
          merge-multiple: true
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "pond ${GITHUB_REF_NAME#v}" --generate-notes build/pond-*.tar.gz build/bin/*.tar.gz
